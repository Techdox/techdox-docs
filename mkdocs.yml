site_name: Techdox Docs
site_url: https://docs.techdox.nz
site_description: Practical self-hosting guides, Docker Compose tutorials, and homelab resources for the Techdox community.
site_author: Techdox
repo_url: https://github.com/Techdox/techdox-docs
repo_name: Techdox/techdox-docs
edit_uri: edit/main/docs/
nav:
  - Home: index.md
  - Start Here: start-here.md
  - All Guides:
      - Browse all guides: guides/index.md
  - Homelab Rebuild:
      - Overview: homelab-rebuild/index.md
  - Resources:
      - About: about.md
      - Donate / Get Support: support.md
      - RackNerd Deals - Cheap VPS: racknerd.md
      - Browse by Tag: tags.md
      - Merch: https://store.techdox.nz

#  - About: about.md
theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/techdox-mark.png
  favicon: assets/techdox-mark.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode


hooks:
  - hooks/catalogue.py

extra_javascript:
  - javascripts/docs.js

plugins:
    - social:
        cards_layout_options:
          background_color: "#1e2030"
          color: "#ffffff"
    - search
    - tags:
        tags_file: tags.md
    - git-revision-date-localized:
        exclude:
          - guides/*
          - topics/*
        enable_creation_date: true
        type: timeago
    - rss:
        match_path: '^(?!(?:guides|topics)/).*[.]md$'
        abstract_chars_count: 160
        categories:
          - tags
    - redirects:
        redirect_maps:
          hoarder.md: karakeep.md
    - minify:
        minify_html: true
markdown_extensions:

  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@techdox
    - icon: fontawesome/brands/discord
      link: https://discord.com/invite/8mX2KRxDw8
    - icon: fontawesome/brands/github
      link: https://github.com/Techdox/techdox-docs
extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2025 Techdox
