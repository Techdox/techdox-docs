name: Docs quality

on:
  pull_request:
  push:
    branches: [main, dev, 'feat/**', 'fix/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Unit and interaction tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          npm test
          npm run test:interactions
      - name: Build and preserve links
        run: |
          mkdocs build --strict
          python tests/check_links.py
      - name: Browser acceptance
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory site > /tmp/docs-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8766/ > /dev/null
          npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-browser-evidence
          path: artifacts/browser/
          if-no-files-found: ignore
